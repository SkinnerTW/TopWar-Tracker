<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top War Alliance Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #4dadff;
            margin-bottom: 5px;
        }

        .clocks-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        .clock-box {
            flex: 1;
            background: #1c2638;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2c3a52;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .clock-label {
            font-size: 0.9rem;
            color: #8fa0ba;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .clock-time {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
        }

        .tracker-container {
            width: 100%;
            max-width: 800px;
            background: #1c2638;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2c3a52;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            color: #8fa0ba;
            font-size: 0.8rem;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .timeline-bar {
            position: relative;
            width: 100%;
            height: 60px;
            background: #25334a;
            border-radius: 6px;
            overflow: visible;
            margin-bottom: 20px;
        }

        .now-line {
            position: absolute;
            top: -10px;
            bottom: -10px;
            width: 3px;
            background-color: #ff4d4d;
            z-index: 10;
            box-shadow: 0 0 8px #ff4d4d;
        }

        .now-label {
            position: absolute;
            top: -25px;
            transform: translateX(-50%);
            background: #ff4d4d;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .event-block {
            position: absolute;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            border-radius: 4px;
            box-sizing: border-box;
            border-left: 2px solid rgba(255,255,255,0.3);
            border-right: 2px solid rgba(255,255,255,0.3);
        }

        .event-reset { background-color: #e67e22; }
        .event-ta { background-color: #2ecc71; }

        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h1>Alliance Event Tracker</h1>
    <p style="color: #8fa0ba; margin-top: 0; margin-bottom: 25px;">Real-time schedule for Top War</p>

    <!-- CLOCKS -->
    <div class="clocks-container">
        <div class="clock-box">
            <div class="clock-label">Server Time (UTC)</div>
            <div class="clock-time" id="utc-clock">00:00:00</div>
        </div>
        <div class="clock-box">
            <div class="clock-label">Your Local Time</div>
            <div class="clock-time" id="local-clock">00:00:00</div>
        </div>
    </div>

    <!-- TRACKER TIMELINE -->
    <div class="tracker-container">
        <div class="timeline-header">
            <span>00:00 UTC</span>
            <span>06:00 UTC</span>
            <span>12:00 UTC</span>
            <span>18:00 UTC</span>
            <span>24:00 UTC</span>
        </div>

        <div class="timeline-bar">
            <!-- Current Time Indicator -->
            <div class="now-line" id="now-indicator">
                <div class="now-label">SERVER NOW</div>
            </div>

            <!-- Server Reset Block (00:00 to 01:00 UTC as an example) -->
            <div class="event-block event-reset" style="left: 0%; width: 4.16%;">Reset</div>

            <!-- Sample TA Block (Let's place one from 12:00 to 14:00 UTC) -->
            <div class="event-block event-ta" style="left: 50%; width: 8.33%;">TA Event</div>
        </div>

        <!-- LEGEND -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color event-reset"></div>
                <span>Server Reset</span>
            </div>
            <div class="legend-item">
                <div class="legend-color event-ta"></div>
                <span>TA Activities</span>
            </div>
        </div>
    </div>

    <script>
        function updateTracker() {
            const now = new Date();

            // 1. Update Digital Clocks
            const utcString = now.toUTCString().slice(17, 25);
            const localString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            
            document.getElementById('utc-clock').textContent = utcString;
            document.getElementById('local-clock').textContent = localString;

            // 2. Move the Timeline Red Bar
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            const utcSeconds = now.getUTCSeconds();

            const totalSecondsInDay = 24 * 60 * 60;
            const currentSeconds = (utcHours * 3600) + (utcMinutes * 60) + utcSeconds;
            
            // Calculate percentage of the day passed in UTC
            const percentPassed = (currentSeconds / totalSecondsInDay) * 100;

            // Move the red line element
            document.getElementById('now-indicator').style.left = percentPassed + '%';
        }

        // Run immediately, then check every single second
        updateTracker();
        setInterval(updateTracker, 1000);
    </script>

</body>
</html>
